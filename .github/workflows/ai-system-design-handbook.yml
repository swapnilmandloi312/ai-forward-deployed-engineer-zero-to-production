name: AI System Design Handbook

on:
  push:
    branches: [main]
    paths: ['ai-system-design-handbook/**', '.github/workflows/ai-system-design-handbook.yml']
  pull_request:
    paths: ['ai-system-design-handbook/**', '.github/workflows/ai-system-design-handbook.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: ai-system-design-handbook
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run behavioral tests
        run: python -m unittest discover -s tests -v
      - name: Run synthetic evaluation
        run: python -m labs.evaluate
      - name: Check documentation
        run: python scripts/check_docs.py
