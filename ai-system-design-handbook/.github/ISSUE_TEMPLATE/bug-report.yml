name: Reproducible lab or documentation bug
description: Report a calculation, broken link, or code behavior.
title: "[Bug] "
body:
  - type: input
    id: environment
    attributes:
      label: Python version and operating system
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Command or minimal synthetic reproduction
      description: Include the file or chapter. Never include secrets or private data.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
